<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=Noto+Serif+JP:wght@900&display=swap">
<style>
:root{--a1:#e5263d;--a2:#ff8a5c;--shu:#e5263d;--text:#f6f3f4;--muted:#b9adb1;--line:rgba(255,255,255,.13);--grad:linear-gradient(120deg,var(--a1),var(--a2))}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;position:relative;font-family:Inter,sans-serif;color:var(--text);
 background:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px) 0 0/54px 54px,linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px) 0 0/54px 54px,radial-gradient(800px 640px at 100% 0,rgba(229,38,61,.42),transparent 62%),radial-gradient(760px 640px at 0 100%,rgba(255,138,92,.18),transparent 62%),#07050a;
 display:flex;flex-direction:column;align-items:center;padding:150px 64px 150px;gap:46px}
.marca{position:absolute;right:-80px;top:560px;font-family:"Noto Serif JP";font-weight:900;font-size:720px;line-height:1;color:rgba(229,38,61,.05)}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;position:relative}
.logo{display:flex;align-items:center;gap:16px;font-family:Sora;font-weight:800;font-size:44px;letter-spacing:-.02em}
.seal{width:68px;height:68px;border-radius:17px;background:var(--shu);display:grid;place-items:center;font-family:"Noto Serif JP";font-weight:900;font-size:42px;color:#fff;transform:rotate(-5deg);box-shadow:0 0 40px rgba(229,38,61,.6)}
.pill{padding:13px 24px;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);font-family:Sora;font-weight:600;font-size:19px;letter-spacing:.2em;text-transform:uppercase;color:#ffb199}
.cli{display:grid;justify-items:center;gap:22px;text-align:center;position:relative}
.cli .lg{height:200px;width:420px;border-radius:30px;display:grid;place-items:center;padding:22px;box-shadow:0 24px 60px -24px rgba(0,0,0,.8)}
.cli .lg img{max-width:100%;max-height:100%;object-fit:contain}
.cli h1{font-family:Sora;font-weight:800;font-size:74px;letter-spacing:-.03em;line-height:1}
.cli p{font-size:30px;color:var(--muted);max-width:860px;line-height:1.35}
.disp{position:relative;width:940px;height:620px;margin-top:10px}
.lap{position:absolute;left:0;top:0;width:800px}
.pant{height:500px;border-radius:22px 22px 6px 6px;background:#111522;padding:16px 16px 12px;box-shadow:0 40px 80px rgba(0,0,0,.6);border:2px solid #2c3142}
.pant img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:8px;display:block}
.base{height:26px;margin:0 -42px;background:linear-gradient(#d7dce6,#9aa1b2);border-radius:0 0 26px 26px;position:relative}
.base::after{content:"";position:absolute;left:50%;top:0;width:140px;height:9px;transform:translateX(-50%);background:#7c8396;border-radius:0 0 10px 10px}
.cel{position:absolute;right:0;bottom:0;width:230px;height:470px;border-radius:38px;background:#0e1017;border:4px solid #3a4054;padding:9px;box-shadow:0 30px 60px rgba(0,0,0,.7)}
.cel img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:29px;display:block}
.url{display:flex;align-items:center;gap:14px;font-family:Sora;font-weight:700;font-size:36px;padding:20px 34px;border-radius:999px;background:rgba(255,255,255,.07);border:1.5px solid var(--line);position:relative}
.url::before{content:"🔗"}
.pie{margin-top:auto;width:100%;display:flex;justify-content:space-between;align-items:center;position:relative}
.pie p{font-family:Sora;font-weight:700;font-size:30px}.pie p small{display:block;font-family:Inter;font-weight:500;font-size:22px;color:var(--muted);margin-top:4px}
.wa{background:#25D366;color:#052814;padding:20px 32px;border-radius:999px;font-family:Sora;font-weight:800;font-size:32px}
</style></head><body>
<div class="marca">義</div>
<div class="top"><div class="logo"><span class="seal">義</span>Solanotech</div><div class="pill">Cliente</div></div>
<div class="cli"><div class="lg" id="lg"><img id="logo" alt=""></div><h1 id="nom"></h1><p id="desc"></p></div>
<div class="disp"><div class="lap"><div class="pant"><img id="pc" alt=""></div><div class="base"></div></div><div class="cel"><img id="cl" alt=""></div></div>
<div class="url" id="url"></div>
<div class="pie"><p>¿Quiere la suya?<small>Página hecha por Solanotech</small></p><div class="wa">WhatsApp 8933-0326</div></div>
<script>
const C={
 hidalgo:['Grúas Hidalgo','Grúa para camiones pesados 24/7 en todo Costa Rica.','gruashidalgoo.com','#ffffff'],
 dieca:['Grúas Dieca S.A.','Grúa telescópica y transporte pesado, con cotizador detallado.','gruadieca.com','#ffc400'],
 mario:['Grúas Mario 24/7','Grúa de plataforma con cotizador y ubicación por WhatsApp.','gruas247mario.com','#ffffff'],
 adriana:['Adriana Solano','Asesora en bonos de vivienda, con solicitud directa a WhatsApp.','adrianasolanobonos.com','#ebf0fa'],
 monzu:['Monzú Detallados','Lavado y detallado a domicilio en Cartago, con paquetes y precios.','Página informativa','#07090b']};
const k=location.hash.slice(1),c=C[k];
nom.textContent=c[0];desc.textContent=c[1];url.textContent=c[2];lg.style.background=c[3];
logo.src='logo-'+k+'.png';pc.src='pc-'+k+'.jpg';cl.src='cel-'+k+'.jpg';
</script>
</body></html>
