<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{--n:#0B1330;--az:#3B74FF;--az2:#1F4FD8;--am:#FFD23F;--ok:#25D366;--t:"Big Shoulders Display",Impact,sans-serif;--s:"Space Grotesk",system-ui,sans-serif;--z:1}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:var(--s);color:var(--n);
 background:radial-gradient(700px 500px at 0% 55%,rgba(59,116,255,.16),transparent 70%),radial-gradient(700px 500px at 100% 60%,rgba(255,210,63,.20),transparent 70%),linear-gradient(180deg,#FFFFFF 0%,#EEF2FB 55%,#E3E9F6 100%);
 display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 50px;gap:62px}
.logo{display:flex;align-items:center;gap:16px;font-family:var(--t);font-weight:800;font-size:58px;letter-spacing:.04em;color:var(--n)}
.logo i{width:76px;height:76px;border-radius:20px;background:var(--az);display:grid;place-items:center;font-style:normal;font-size:48px;color:#fff;box-shadow:0 10px 30px rgba(59,116,255,.45)}
h1{text-align:center;font-weight:700;font-size:96px;line-height:1.05;letter-spacing:-.04em}
h1 span{display:inline-block;margin-top:10px;background:linear-gradient(90deg,var(--az2),var(--az));color:#fff;padding:4px 30px 14px;border-radius:26px;box-shadow:0 14px 34px rgba(31,79,216,.35)}
.sub{font-size:31px;color:#4A5372;text-align:center;font-weight:500;margin-top:-10px}.sub b{color:var(--n)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:56px 34px;zoom:var(--z);margin-top:8px}
.it{position:relative;width:470px;padding-bottom:6px}
.lap{width:430px;margin-left:40px}
.it.der .lap{margin-left:0}
.pant{height:270px;border-radius:16px 16px 4px 4px;background:#111522;padding:10px 10px 8px;box-shadow:0 26px 50px rgba(11,19,48,.28)}
.pant img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:6px;display:block}
.base{height:16px;margin:0 -26px;background:linear-gradient(#D7DCE6,#9AA1B2);border-radius:0 0 18px 18px;position:relative}
.base::after{content:"";position:absolute;left:50%;top:0;width:90px;height:6px;transform:translateX(-50%);background:#7C8396;border-radius:0 0 8px 8px}
.cel{position:absolute;bottom:84px;z-index:2;left:0;width:118px;height:244px;border-radius:22px;background:#0E1017;border:3px solid #2E3445;padding:5px;box-shadow:0 20px 40px rgba(11,19,48,.4)}
.it.der .cel{left:auto;right:0}
.cel img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:17px;display:block}
.nom{display:flex;justify-content:center;margin-top:18px}
.nom b{background:#fff;border:1.5px solid #D5DCEC;border-radius:999px;padding:9px 22px;font-size:24px;font-weight:700;box-shadow:0 6px 16px rgba(11,19,48,.08)}
.nom b small{color:#6B7392;font-weight:500;font-size:20px;margin-left:6px}
.btn{display:flex;align-items:center;gap:18px;background:var(--ok);color:#052814;padding:24px 46px;border-radius:999px;font-weight:700;font-size:44px;box-shadow:0 18px 40px rgba(37,211,102,.4);margin-top:6px}
.btn svg{width:52px;height:52px}
.pie{font-size:28px;color:#4A5372;font-weight:500}.pie b{color:var(--n)}
/* post 1080x1350 */
body.post{height:1350px;padding:40px 50px;gap:22px;--z:.86}
body.post .logo{font-size:44px}body.post .logo i{width:58px;height:58px;font-size:36px;border-radius:15px}
body.post h1{font-size:68px}body.post h1 span{padding:2px 24px 10px;border-radius:20px;margin-top:6px}
body.post .sub{font-size:25px;margin-top:-6px}
body.post .btn{font-size:36px;padding:18px 38px}body.post .btn svg{width:42px;height:42px}
body.post .pie{font-size:23px;margin-top:-6px}
</style></head><body>
<div class="logo"><i>S</i>SOLANOTECH</div>
<h1>¿Su negocio todavía<br><span>no tiene página web?</span></h1>
<p class="sub">Algunas páginas que ya hicimos para <b>negocios de Costa Rica</b></p>
<div class="grid">
 <div class="it"><div class="lap"><div class="pant"><img src="pc-dieca.jpg" alt=""></div><div class="base"></div></div><div class="cel"><img src="cel-dieca.jpg" alt=""></div><div class="nom"><b>Grúas Dieca</b></div></div>
 <div class="it der"><div class="lap"><div class="pant"><img src="pc-hidalgo.jpg" alt=""></div><div class="base"></div></div><div class="cel"><img src="cel-hidalgo.jpg" alt=""></div><div class="nom"><b>Grúas Hidalgo</b></div></div>
 <div class="it"><div class="lap"><div class="pant"><img src="pc-mario.jpg" alt=""></div><div class="base"></div></div><div class="cel"><img src="cel-mario.jpg" alt=""></div><div class="nom"><b>Grúas Mario</b></div></div>
 <div class="it der"><div class="lap"><div class="pant"><img src="pc-adriana.jpg" alt=""></div><div class="base"></div></div><div class="cel"><img src="cel-adriana.jpg" alt=""></div><div class="nom"><b>Adriana Solano <small>· Bonos</small></b></div></div>
</div>

<p class="pie">Páginas web <b>desde ₡75.000</b> · ssolanotech.com</p>
</body></html>
