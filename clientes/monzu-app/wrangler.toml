# Configuración para Cloudflare Pages (Monzú Detallados)
name = "monzu-detallados"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Base de datos D1: cree una llamada "monzu" en Cloudflare y pegue aquí su "Database ID".
[[d1_databases]]
binding = "DB"
database_name = "monzu"
database_id = "PEGAR-AQUI-EL-ID-DE-D1"
