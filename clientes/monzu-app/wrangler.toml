# Monzú Detallados en Cloudflare Workers: página (public/) + servidor (/api) + base de datos D1.
# El nombre debe ser igual al del Worker en Cloudflare.
name = "demomonzu"
main = "worker/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Base de datos: al publicar, Cloudflare la crea sola con este nombre (no hace falta poner el ID).
[[d1_databases]]
binding = "DB"
database_name = "monzu"
