# Monzú Detallados en Cloudflare Workers: página (public/) + servidor (/api) + base de datos D1.
# El nombre debe ser igual al del Worker en Cloudflare.
name = "demomonzu"
main = "worker/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/"]

# Base de datos: al publicar, Cloudflare la crea sola con este nombre (no hace falta poner el ID).
[[d1_databases]]
binding = "DB"
database_name = "monzu"

# Dirección pública de la página (se usa como contacto en las notificaciones).
[vars]
SITIO_URL = "https://demomonzu.sebas43br.workers.dev"

# Recordatorios automáticos: revisa las citas cada 10 minutos (gratis, hasta 5 tareas programadas).
[triggers]
crons = ["*/10 * * * *"]
